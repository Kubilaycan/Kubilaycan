name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # every day at 06:00 Istanbul time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", ".github/scripts/**"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

# Renders the four pixel-world panels (profile, calendar, languages, habits) into metrics/
# with our own script, then commits them if anything changed.
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render panels
        timeout-minutes: 8
        env:
          # Classic PAT with the "repo" and "read:user" scopes, saved as a repository secret
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/panels.mjs metrics

      - name: Commit panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update metrics [skip ci]"
            git pull --rebase
            git push
          fi
