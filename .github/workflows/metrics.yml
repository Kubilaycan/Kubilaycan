name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # every day at 06:00 Istanbul time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic PAT with the "repo" and "read:user" scopes, saved as a repository secret
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: github-metrics.svg
          template: classic
          config_display: large
          config_timezone: Europe/Istanbul
          config_octicon: yes
          base: header, repositories
          repositories_affiliations: owner, collaborator, organization_member

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_days: 30
          plugin_habits_from: 300
          plugin_habits_languages_limit: 8

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          # Unity serialises assets in files GitHub detects as ShaderLab/Mathematica, so hide that noise
          plugin_languages_ignored: shaderlab, mathematica, wolfram language
