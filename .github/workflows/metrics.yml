name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # every day at 06:00 Istanbul time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", ".github/scripts/**"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

# Each panel is rendered on its own so the README can lay them out as a 2x2 bento grid.
# Panels are allowed to fail or time out individually; whatever rendered is committed once at the end.
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Profile panel
        uses: lowlighter/metrics@latest
        timeout-minutes: 5
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/profile.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: header, repositories
          repositories_affiliations: owner, collaborator, organization_member

      - name: Calendar panel
        uses: lowlighter/metrics@latest
        timeout-minutes: 5
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/calendar.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Languages panel
        uses: lowlighter/metrics@latest
        timeout-minutes: 5
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/languages.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          # Unity serialises assets in files GitHub detects as ShaderLab/Mathematica, so hide that noise
          plugin_languages_ignored: shaderlab, mathematica, wolfram language

      # lowlighter's habits plugin crashes since GitHub dropped commit lists from PushEvent payloads,
      # and its lines plugin hangs on contributor stats, so this panel is rendered by our own script.
      - name: Habits panel
        timeout-minutes: 5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/habits.mjs metrics/habits.svg

      - name: Commit panels
        if: always()
        run: |
          mkdir -p metrics
          if [ -d /metrics_renders/metrics ]; then cp -r /metrics_renders/metrics/. metrics/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update metrics [skip ci]"
            git push
          fi
