name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # every day at 06:00 Istanbul time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

# Each panel is rendered on its own so the README can lay them out as a 2x2 bento grid.
# Renders go to /metrics_renders and are committed once at the end.
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Profile panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/profile.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: header, repositories
          repositories_affiliations: owner, collaborator, organization_member

      - name: Calendar panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/calendar.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Languages panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/languages.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          # Unity serialises assets in files GitHub detects as ShaderLab/Mathematica, so hide that noise
          plugin_languages_ignored: shaderlab, mathematica, wolfram language

      # The habits plugin crashes since GitHub dropped commit lists from PushEvent payloads,
      # so this panel uses repository contributor stats instead.
      - name: Code activity panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kubilaycan
          filename: metrics/activity.svg
          output_action: none
          config_timezone: Europe/Istanbul
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 10

      - name: Commit panels
        run: |
          mkdir -p metrics
          cp -r /metrics_renders/metrics/. metrics/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || git commit -m "Update metrics" && git push
